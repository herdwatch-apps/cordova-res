name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ${{github.workspace}}/package-lock.json
      - name: npm install, build, and test
        env:
          CI: true
        run: |
          npm install
          npm run lint
          npm run build
          npm test
